# 시간 맞춤 알림 — 30분마다 /api/cron/frequent 호출 (오전 촬영 전날 저녁 안내, 촬영 후 진행·반납 버튼)
# Vercel 무료 요금제 크론은 하루 1번뿐이라 GitHub Actions 예약 실행으로 부른다.
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   APP_URL     실제 운영 주소 (예: https://team-workspace-dusky.vercel.app)
#   CRON_SECRET Vercel 환경변수 CRON_SECRET 과 같은 값
# 시크릿이 없으면 아무것도 하지 않고 성공으로 끝난다 (실패 메일 방지).
# KST 07~23시만 (UTC 22~23시, 0~14시) — 무료 실행 시간 절약. :07/:37 처럼 정각을 피해 지연·누락을 줄인다.
name: cron-frequent

on:
  schedule:
    - cron: "7,37 22,23 * * *"
    - cron: "7,37 0-14 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/frequent
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET 시크릿이 없어 건너뜀"
            exit 0
          fi
          curl -sS -m 120 -o /tmp/out.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/frequent" || true
          cat /tmp/out.json || true
